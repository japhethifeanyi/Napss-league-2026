<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAPSS League 2026</title><style>body{margin:0;font-family:Arial;background:#f3f7f6;color:#17302c}header{background:#075e54;color:#fff;padding:22px 16px}main{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 4px 15px #0001}.nav{display:flex;gap:8px;overflow:auto;margin-top:15px}.nav button{border:0;border-radius:20px;padding:10px 15px;font-weight:bold}.nav button.active{background:#fff;color:#075e54}.match{display:flex;justify-content:space-between;align-items:center;text-align:center;gap:10px}.team{font-weight:bold;flex:1}.score{font-size:25px;font-weight:900}table{width:100%;border-collapse:collapse}th,td{padding:10px 5px;border-bottom:1px solid #ddd;text-align:center}th:nth-child(2),td:nth-child(2){text-align:left}.note{background:#e7f5f1;padding:12px;border-radius:10px}</style></head><body><header><h1>⚽ NAPSS LEAGUE 2026</h1><div>Official Tournament Centre</div><div class="nav"><button class="active" onclick="show('home',this)">Home</button><button onclick="show('fixtures',this)">Fixtures</button><button onclick="show('results',this)">Results</button><button onclick="show('table',this)">League Table</button><button onclick="show('updates',this)">Updates</button></div></header><main><section id="home"><div class="card"><h2>Welcome 🏆</h2><p>Follow fixtures, results, standings and tournament announcements here.</p><div class="note">Admin controls and automatic updates will be connected to the tournament database.</div></div></section><section id="fixtures" style="display:none"><div class="card"><h2>Fixtures</h2><div id="fx"></div></div></section><section id="results" style="display:none"><div class="card"><h2>Results</h2><div id="rs"></div></div></section><section id="table" style="display:none"><div class="card"><h2>League Table</h2><div id="tb"></div></div></section><section id="updates" style="display:none"><div class="card"><h2>Tournament Updates</h2><p>No announcements yet.</p></div></section></main><script>const teams=['Franco A','Franco B','Team C','Team D'];const fixtures=[{h:'Franco A',a:'Franco B',d:'23 Aug 2026',t:'14:00',s:'FT',hg:1,ag:2},{h:'Team C',a:'Team D',d:'24 Aug 2026',t:'14:00',s:'UPCOMING'},{h:'Franco A',a:'Team C',d:'25 Aug 2026',t:'14:00',s:'UPCOMING'}];function show(id,b){document.querySelectorAll('main>section').forEach(x=>x.style.display='none');document.getElementById(id).style.display='block';document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}function list(){fx.innerHTML=fixtures.filter(x=>x.s!='FT').map(x=>`<div class="card"><div class="match"><div class="team">${x.h}</div><b>VS</b><div class="team">${x.a}</div></div><p>${x.d} • ${x.t}</p></div>`).join('');rs.innerHTML=fixtures.filter(x=>x.s=='FT').map(x=>`<div class="card"><div class="match"><div class="team">${x.h}</div><div class="score">${x.hg} — ${x.ag}</div><div class="team">${x.a}</div></div><p>${x.d}</p></div>`).join('');let q={};teams.forEach(t=>q[t]={p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});fixtures.filter(x=>x.s=='FT').forEach(x=>{let h=q[x.h],a=q[x.a];h.p++;a.p++;h.gf+=x.hg;h.ga+=x.ag;a.gf+=x.ag;a.ga+=x.hg;if(x.hg>x.ag){h.w++;a.l++;h.pts+=3}else if(x.hg<x.ag){a.w++;h.l++;a.pts+=3}else{h.d++;a.d++;h.pts++;a.pts++}});let rows=Object.entries(q).sort((a,b)=>b[1].pts-a[1].pts);tb.innerHTML=`<table><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr>${rows.map((x,i)=>`<tr><td>${i+1}</td><td><b>${x[0]}</b></td><td>${x[1].p}</td><td>${x[1].w}</td><td>${x[1].d}</td><td>${x[1].l}</td><td>${x[1].gf-x[1].ga}</td><td><b>${x[1].pts}</b></td></tr>`).join('')}</table>`}list();</script></body></html>
